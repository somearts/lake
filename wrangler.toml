name = "odd-snow-0a72"
main = "worker.js"
compatibility_date = "2026-09-26"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "golake.app", custom_domain = true },
  { pattern = "www.golake.app", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "lake-waitlist"
database_id = "2caf93ba-0592-481e-a602-5281c66d5386"

[env.preview]
name = "lake-preview"
workers_dev = true
preview_urls = true

[env.preview.assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "lake-waitlist-preview"
database_id = "e289aadb-2805-4a47-87b1-1cfc44cc598a"
